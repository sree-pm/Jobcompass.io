name = "jobcompass-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# D1 — single DB, env-bound
[[d1_databases]]
binding = "DB"
database_name = "jobcompass-db"
database_id = "58eb5864-0d30-412e-a6d8-b22c1384d88f"

# R2 — PDFs + cover letters
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "jobcompass-pdfs"

# KV — cache, rate limits, dedupe
[[kv_namespaces]]
binding = "CACHE"
id = "6e7fa9600a5b47b4be60ef4a03e8a16d"

# Queue — ingest jobs
# Producer: cron + manual refresh enqueue candidate ingest messages
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "jobcompass-ingest-queue"

# Consumer: batched, with retries + dead-letter queue for poison messages.
# max_batch_size 10 → each batch = up to 10 candidate ingests; batches of 10
# keep per-message CPU inside the 30s limit while still parallelising.
# max_retries 2 + DLQ = failed jobs are preserved for inspection, never lost,
# and never block the queue (poison-message protection at 100k-user scale).
[[queues.consumers]]
queue = "jobcompass-ingest-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "jobcompass-ingest-dlq"

[triggers]
crons = ["0 6 * * *"]  # 06:00 UTC == 06:00 GMT / 07:00 BST — adjust via cron override in dashboard

# Workers AI — A3 verifier, A4 classifier, A5 embeddings (free tier: 10K neurons/day)
[ai]
binding = "AI"

# Vectorize — job embeddings for the A5 Matchmaker (free: 5M stored + 30M queried dims/mo)
[[vectorize]]
binding = "VECTORIZE"
index_name = "jobcompass-jobs"

# Email Sending — transactional emails from jobcompass.io (PIN codes, receipts)
# SPF/DKIM auto-configured by Cloudflare on domain onboarding
[[send_email]]
name = "EMAIL"

[vars]
AI_PROVIDER = "openai-compatible"
AI_BASE_URL = "https://api.openai.com/v1"
ENVIRONMENT = "production"
# AI_API_KEY, AI_MODEL set via `wrangler secret put` — never in toml
# API_KEY set via `wrangler secret put API_KEY` — guards all routes except /health, /init

# Optional: Browser Rendering for real PDF generation
# Uncomment to enable @cloudflare/puppeteer → A4 PDF via Cloudflare Browser Rendering.
# Requires `npm i @cloudflare/puppeteer` and a paid Workers plan with Browser Rendering enabled.
# [[browser]]
# binding = "BROWSER"
