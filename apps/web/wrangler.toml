name = "jobcompass-web"
main = "worker.js"
compatibility_date = "2025-08-01"

# Static assets + intelligent 404: known SPA routes get index.html (200),
# truly-unknown paths get 404.html with real 404 status (no soft-404 SEO poison).
[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"

[vars]
VITE_API_URL = "https://jobcompass-api.infonaut.workers.dev"
